services:
  - type: web
    name: bowltrack-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    disk:
      name: bowltrack-data
      mountPath: /opt/render/project/src/server
      sizeGB: 1
